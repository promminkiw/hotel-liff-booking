# CI: run backend tests and check the frontend builds cleanly on every
# push/PR to main. This is a test gate, not the deploy step - Render
# (Phase 22) auto-deploys on push to main once connected to this repo, and
# Vercel does the same for the frontend, so there's no separate deploy job
# here to keep credentials for those out of GitHub Actions entirely.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-liff-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-liff-backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          # Dummy values so config/env.js's fail-fast check passes at import
          # time - the unit tests themselves are pure functions
          # (validateBookingInput, getVirtualStatus, getCancellationError,
          # datesOverlap) that never touch Supabase/LINE/Gemini for real,
          # but env.js's required-vars check runs as an import side effect
          # before any test code executes, so it needs *something* set.
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: dummy
          ALLOWED_ORIGIN: https://example.com
          LINE_CHANNEL_ID: dummy
          LINE_CHANNEL_SECRET: dummy
          LINE_MESSAGING_ACCESS_TOKEN: dummy
          GEMINI_API_KEY: dummy
          ADMIN_PASSWORD: dummy
          ADMIN_SECRET: dummy

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotel-liff-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-liff-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Dummy values so env.js's fail-fast check passes during build -
          # the actual bundle only reads these client-side after deploy,
          # this step just proves the app compiles.
          VITE_API_BASE_URL: https://example.com
          VITE_LIFF_ID: 0000000000-aaaaaaaaaaaaaaaaaaaaaaaa
